server {
    listen 80;
    listen [::]:80;
    server_name QT-ERP-2026-036.rootk-eg.com qt-erp-2026-036.rootk-eg.com;
    return 301 https://QT-ERP-2026-036.rootk-eg.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name QT-ERP-2026-036.rootk-eg.com qt-erp-2026-036.rootk-eg.com;

    ssl_certificate /etc/letsencrypt/live/rootk-eg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rootk-eg.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/QT-ERP-2026-036;
    index index.html;

    client_max_body_size 5M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /Custom_Engineering_ERP_Quotation.html {
        return 302 /;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/png;
    gzip_min_length 256;
}
